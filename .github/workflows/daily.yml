name: Günlük bulmacalar

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 03:17 UTC (06:17 TR)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Eksik günleri üret
        run: python3 generate.py
      - name: Yayınla
        run: |
          git config user.name "seepwise-bot"
          git config user.email "seepwise-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Günlük bulmacalar $(date -u +%F)"
            git push
          fi
